[pytest]
testpaths = tests/api tests/e2e tests/smoke
norecursedirs = tests/regression
python_files = test_*.py
addopts = -ra
markers =
    smoke: read-only fast deployment verification
    regression: deterministic regression checks
    e2e: end-to-end browser test in isolated local data
    destructive: mutation requiring loopback and a test-data manifest
