name: P0 post-deployment smoke

on:
  deployment_status:
  workflow_call:
    secrets:
      RELEASE_PROTECTION_READ_TOKEN:
        description: Optional separately approved repository protection metadata read token
        required: false
    inputs:
      deployment_json:
        description: Full trusted deployment/deployment_status event envelope
        type: string
        required: true

permissions:
  contents: read
  actions: read
  deployments: read

concurrency:
  group: p0-smoke-${{ github.event.deployment.environment || 'provider-call' }}
  cancel-in-progress: false

jobs:
  smoke:
    name: P0 verified post-deploy smoke
    if: inputs.deployment_json != '' || contains(fromJSON('["success","failure","error"]'), github.event.deployment_status.state)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Use the protected default-branch test harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Capture provider event without shell interpolation
        env:
          PROVIDER_EVENT_JSON: ${{ inputs.deployment_json }}
        run: |
          python - <<'PY'
          import json,os,pathlib
          raw = os.environ.get('PROVIDER_EVENT_JSON') or pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text()
          folder = pathlib.Path('outputs/p0-10/post-deploy'); folder.mkdir(parents=True,exist_ok=True)
          (folder/'event.json').write_text(json.dumps(json.loads(raw)))
          PY
      - name: Verify provider identity, authorization and exact target
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_PROTECTION_READ_TOKEN: ${{ secrets.RELEASE_PROTECTION_READ_TOKEN }}
        run: python scripts/release_gate.py event --input outputs/p0-10/post-deploy/event.json --output outputs/p0-10/post-deploy/deployment.json
      - name: Install pinned smoke dependencies
        run: |
          python -m pip install -r python-playwright/requirements.lock
          python -m playwright install --with-deps chrome
      - name: Run read-only smoke and independently verify its reports
        if: always()
        run: python scripts/post_deploy_smoke.py --deployment outputs/p0-10/post-deploy/deployment.json --report-dir outputs/p0-10/post-deploy
      - name: Retain sanitized SHA-bound smoke evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: p0-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: outputs/p0-10/post-deploy/publish/
          retention-days: 7
          if-no-files-found: error

# A deployment job using GITHUB_TOKEN must use needs + workflow_call directly.
# Its deployment_status event alone may not launch another workflow.
